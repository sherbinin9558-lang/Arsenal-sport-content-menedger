name: Python syntax check

on:
  push:
    branches: ["main", "real-attribution-v3", "audit-clone-20261004", "audit-test-20261004"]
  pull_request:
    branches: ["main", "audit-clone-20261004", "audit-test-20261004"]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency auditor
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit declared dependencies
        run: pip-audit -r requirements.txt
